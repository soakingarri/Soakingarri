[pytest]
# pytest does not invoke the stdlib `load_tests` protocol that every
# test_*.py file in this project uses to pull in doctest.DocTestSuite(module)
# (that's a `python -m unittest` / `python3 test_x.py` -only mechanism).
# Without this, every doctest example embedded in source/ and data/ask/
# modules is silently skipped when running `pytest`. --doctest-modules makes
# pytest collect those examples directly from the modules themselves.
addopts = --doctest-modules
testpaths = source data/ask
